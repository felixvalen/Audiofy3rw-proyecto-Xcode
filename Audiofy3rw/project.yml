      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tuempresa.audiofy3rw
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Audiofy3rw/Info.plist
        # Cuando Apple conceda el permiso de CarPlay, descomenta:
        # CODE_SIGN_ENTITLEMENTS: Audiofy3rw/Audiofy3rw.entitlements
